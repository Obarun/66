image: obarun/base:latest

stages:
  - build
  - release
  - request
  - docbuild
  - docdeploy

before_script:
  - pacman -Syu --noconfirm
  - pacman -S base-devel meson git lowdown --noconfirm

request:
  stage: request
  script:
  - ./build_toolchain.sh "commit"
  - meson setup build -D test=true
  - meson compile -C build
  - DESTDIR=gitlab-ci meson install -C build

  only:
  - merge_requests

build:
  stage: build
  script:
  - ./build_toolchain.sh
  - meson setup build -D test=true
  - meson compile -C build
  - meson test -C build
  - DESTDIR=gitlab-ci meson install -C build

  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

release:
  stage: release
  script:
  - ./build_toolchain.sh
  - meson setup build -D test=true -D with-doc=true -D s6-log-user=s6log
  - meson compile -C build
  - meson test -C build
  - DESTDIR=gitlab-ci meson install -C build

  only:
      refs:
        - tags

docbuild:
  stage: docbuild
  image:
    name: squidfunk/mkdocs-material:latest
    entrypoint: [""]
  before_script:
    - apk add --no-cache build-base meson ninja lowdown
  script:
    - meson setup build -D with-doc=true -D doc-only=true -D s6-log-user=s6log
    - meson compile -C build doc
    - mkdocs build -f build/doc/mkdocs/mkdocs.yml -d "$PWD/site" --clean
  artifacts:
    paths:
      - site/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

docdeploy:
  stage: docdeploy
  image: alpine:latest
  needs:
    - job: docbuild
      artifacts: true
  before_script: []
  script:
    - sh doc/ci/deploy.sh
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"